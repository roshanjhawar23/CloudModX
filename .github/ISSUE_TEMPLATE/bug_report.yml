name: Bug report
description: Something in CloudModX is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** include passwords, AWS keys or other secrets.
        For security vulnerabilities, use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem, including any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `docker compose up --build -d`
        2. Open http://localhost
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running CloudModX?
      options:
        - Docker Compose (local)
        - Host-run (backend/frontend on my machine)
        - AWS (Terraform + EC2)
        - Running the tests only
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and versions of Docker, Python, Node.js or Terraform, as relevant.
      placeholder: "Windows 11, Docker Desktop 4.x, Python 3.11, Node 20"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: For example the output of `docker compose logs backend`. This is rendered as code automatically.
      render: shell
