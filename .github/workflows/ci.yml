name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        run: python -m pytest tests -v

  frontend:
    name: Frontend (production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<2.0.0"
      - name: Check formatting
        run: terraform fmt -check -recursive -diff
      - name: Init (no backend, no AWS credentials needed)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from example
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Run migrations and seed
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend python -m app.database.seed
      - name: Check API directly
        run: curl -fsS http://localhost:8000/api/health | tee /dev/stderr | grep -q '"database_connected":true'
      - name: Check API through Nginx
        run: curl -fsS http://localhost/api/health | grep -q '"status":"healthy"'
      - name: Check seeded data through Nginx
        run: curl -fsS http://localhost/api/v1/modules | grep -q 'Course Catalog Service'
      - name: Check frontend is served
        run: curl -fsS http://localhost/ | grep -qi '<div id="root">'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Block committed secret files
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^/]*local$|\.tfvars$|\.tfvars\.json$|\.tfstate(\..*)?$|\.pem$|\.key$|(^|/)credentials$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must not be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No secret files are tracked."
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history for secrets
        run: gitleaks git . --redact --no-banner -v
